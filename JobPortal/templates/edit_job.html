{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow border-0 p-4 rounded-4">

                <h3 class="mb-4">
                    <i class="bi bi-pencil-square text-primary"></i>
                    Edit Job
                </h3>

                <form method="POST">

                    <!-- Company Name (Readonly) -->

                    <div class="mb-3">

                        <label class="form-label">
                            Company Name
                        </label>

                        <input type="text"
                               name="company_name"
                               value="{{ job.company_name }}"
                               class="form-control"
                               readonly
                               style="background:#f8fafc;">

                        <small class="text-muted">
                            <i class="bi bi-info-circle"></i>
                            Company name cannot be changed
                        </small>

                    </div>

                    <!-- Job Title -->

                    <div class="mb-3">

                        <label class="form-label">
                            Job Title
                        </label>

                        <input type="text"
                               name="job_title"
                               value="{{ job.job_title }}"
                               class="form-control"
                               required>

                    </div>

                    <!-- Location -->

                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input type="text"
                               name="location"
                               value="{{ job.location }}"
                               class="form-control"
                               required>

                    </div>

                    <!-- Experience -->

                    <div class="mb-3">

                        <label class="form-label">
                            Experience
                        </label>

                        <select name="experience"
                                class="form-select">

                            <option value="Fresher"
                                {% if job.experience == "Fresher" %}selected{% endif %}>
                                Fresher
                            </option>

                            <option value="1 Year"
                                {% if job.experience == "1 Year" %}selected{% endif %}>
                                1 Year
                            </option>

                            <option value="2 Years"
                                {% if job.experience == "2 Years" %}selected{% endif %}>
                                2 Years
                            </option>

                            <option value="3 Years"
                                {% if job.experience == "3 Years" %}selected{% endif %}>
                                3 Years
                            </option>

                            <option value="5+ Years"
                                {% if job.experience == "5+ Years" %}selected{% endif %}>
                                5+ Years
                            </option>

                        </select>

                    </div>

                    <!-- Salary -->

                    <div class="mb-3">

                        <label class="form-label">
                            Salary
                        </label>

                        <input type="text"
                               name="salary"
                               value="{{ job.salary }}"
                               class="form-control"
                               placeholder="4 LPA">

                    </div>

                    <!-- Skills -->

                    <div class="mb-3">

                        <label class="form-label">
                            Skills Required
                        </label>

                        <input type="text"
                               name="skills"
                               value="{{ job.skills }}"
                               class="form-control"
                               placeholder="Python, Flask, SQL">

                    </div>

                    <!-- Description -->

                    <div class="mb-4">

                        <label class="form-label">
                            Job Description
                        </label>

                        <textarea name="description"
                                  class="form-control"
                                  rows="5"
                                  required>{{ job.description }}</textarea>

                    </div>

                    <!-- Buttons -->

                    <div class="d-flex gap-2">

                        <button class="btn btn-primary flex-grow-1 py-2">
                            <i class="bi bi-check-circle"></i>
                            Update Job
                        </button>

                        <a href="/employer_dashboard"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
