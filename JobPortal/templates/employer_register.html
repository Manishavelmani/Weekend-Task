{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-5">

                    <h2 class="text-center fw-bold mb-2">
                        Employer Registration
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Hire the best candidates
                    </p>

                    <form method="POST">

                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   required>
                        </div>

                        <!-- Mobile -->
                        <div class="mb-3">
                            <label class="form-label">
                                Mobile Number
                            </label>

                            <div class="input-group">
                                <span class="input-group-text">
                                    +91
                                </span>

                                <input type="text"
                                       name="mobile"
                                       class="form-control"
                                       maxlength="10"
                                       required>
                            </div>
                        </div>

                        <!-- Company Name -->
                        <div class="mb-3">
                            <label class="form-label">
                                Company Name
                            </label>

                            <input type="text"
                                   name="company_name"
                                   class="form-control"
                                   required>
                        </div>

                        <!-- Company Type -->
                        <div class="mb-3">
                            <label class="form-label">
                                Company Type
                            </label>

                            <select name="company_type"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Company Type
                                </option>

                                <option value="IT Company">
                                    IT Company
                                </option>

                                <option value="Startup">
                                    Startup
                                </option>

                                <option value="Consultancy">
                                    Consultancy
                                </option>

                                <option value="Product Company">
                                    Product Company
                                </option>

                                <option value="Product Company">
                                    Health Care
                                </option>

                                <option value="Product Company">
                                    Banking
                                </option>

                            </select>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   required>
                        </div>

                        <button class="btn btn-success w-100 py-2">
                            Register
                        </button>

                    </form>

                    <hr>

                    <p class="text-center mb-0">

                        Already have an account?

                        <a href="/employer_login">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
