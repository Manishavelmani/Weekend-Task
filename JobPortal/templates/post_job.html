{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-5">

                    <h2 class="fw-bold text-center mb-2">
                        Post New Job
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Find the right candidate for your company
                    </p>

                    <form method="POST">

                        <!-- Company Name (Auto from DB) -->

                        <div class="mb-3">

                            <label class="form-label">
                                Company Name
                            </label>

                            <input type="text"
                                   name="company_name"
                                   value="{{ employer.company_name }}"
                                   class="form-control"
                                   readonly
                                   style="background:#f8fafc;">

                            <small class="text-muted">
                                <i class="bi bi-info-circle"></i>
                                Auto-filled from your profile
                            </small>

                        </div>

                        <!-- Job Title -->

                        <div class="mb-3">

                            <label class="form-label">
                                Job Title
                            </label>

                            <input type="text"
                                   name="job_title"
                                   class="form-control"
                                   placeholder="Python Developer"
                                   required>

                        </div>

                        <!-- Location -->

                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input type="text"
                                   name="location"
                                   class="form-control"
                                   placeholder="Chennai"
                                   required>

                        </div>

                        <!-- Experience -->

                        <div class="mb-3">

                            <label class="form-label">
                                Experience
                            </label>

                            <select name="experience" class="form-select">
                                <option>Fresher</option>
                                <option>1 Year</option>
                                <option>2 Years</option>
                                <option>3 Years</option>
                                <option>5+ Years</option>
                            </select>

                        </div>

                        <!-- Salary -->

                        <div class="mb-3">

                            <label class="form-label">
                                Salary
                            </label>

                            <input type="text"
                                   name="salary"
                                   class="form-control"
                                   placeholder="4 LPA">

                        </div>

                        <!-- Skills -->

                        <div class="mb-3">

                            <label class="form-label">
                                Skills Required
                            </label>

                            <input type="text"
                                   name="skills"
                                   class="form-control"
                                   placeholder="Python, Flask, SQL">

                        </div>

                        <!-- Description -->

                        <div class="mb-4">

                            <label class="form-label">
                                Job Description
                            </label>

                            <textarea name="description"
                                      rows="6"
                                      class="form-control"
                                      placeholder="Describe the job role..."></textarea>

                        </div>

                        <!-- Button -->

                        <button class="btn btn-primary w-100 py-2">
                            <i class="bi bi-plus-circle"></i>
                            Post Job
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
