<div class="row g-4 mb-4">

    <div class="col-xl-2 col-lg-4 col-md-6">
        <div class="card border-0 shadow-sm h-100 kpi-card">
            <div class="card-body text-center">
                <i class="bi bi-calendar-check text-primary fs-1"></i>
                <h2 class="fw-bold mt-3">{{ "{:,}".format(total_bookings) }}</h2>
                <p class="text-muted mb-0">Total Bookings</p>
            </div>
        </div>
    </div>

    <div class="col-xl-2 col-lg-4 col-md-6">
        <div class="card border-0 shadow-sm h-100 kpi-card">
            <div class="card-body text-center">
                <i class="bi bi-x-circle-fill text-danger fs-1"></i>
                <h2 class="fw-bold mt-3">{{ cancellation_rate }}%</h2>
                <p class="text-muted mb-0">Cancellation Rate</p>
            </div>
        </div>
    </div>

    <div class="col-xl-2 col-lg-4 col-md-6">
        <div class="card border-0 shadow-sm h-100 kpi-card">
            <div class="card-body text-center">
                <i class="bi bi-cash-stack text-success fs-1"></i>
                <h2 class="fw-bold mt-3">{{ average_adr }}</h2>
                <p class="text-muted mb-0">Average ADR</p>
            </div>
        </div>
    </div>

    <div class="col-xl-2 col-lg-4 col-md-6">
        <div class="card border-0 shadow-sm h-100 kpi-card">
            <div class="card-body text-center">
                <i class="bi bi-moon-stars text-warning fs-1"></i>
                <h2 class="fw-bold mt-3">{{ average_stay }}</h2>
                <p class="text-muted mb-0">Average Stay</p>
            </div>
        </div>
    </div>

    <div class="col-xl-2 col-lg-4 col-md-6">
        <div class="card border-0 shadow-sm h-100 kpi-card">
            <div class="card-body text-center">
                <i class="bi bi-people-fill text-info fs-1"></i>
                <h2 class="fw-bold mt-3">{{ average_guests }}</h2>
                <p class="text-muted mb-0">Average Guests</p>
            </div>
        </div>
    </div>

    <div class="col-xl-2 col-lg-4 col-md-6">
        <div class="card border-0 shadow-sm h-100 kpi-card">
            <div class="card-body text-center">
                <i class="bi bi-arrow-repeat text-secondary fs-1"></i>
                <h2 class="fw-bold mt-3">{{ repeat_guest_rate }}%</h2>
                <p class="text-muted mb-0">Repeat Guests</p>
            </div>
        </div>
    </div>

</div>
