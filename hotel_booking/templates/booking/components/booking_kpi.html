<div class="row g-4 mb-4">

    <div class="col-lg-4">

        <div class="card border-0 shadow-sm h-100">

            <div class="card-body text-center">

                <i class="bi bi-calendar2-check display-5 text-primary"></i>

                <h2 class="fw-bold mt-3">

                    {{ "{:,}".format(total_bookings) }}

                </h2>

                <p class="text-muted mb-0">

                    Total Bookings

                </p>

            </div>

        </div>

    </div>

    <div class="col-lg-4">

        <div class="card border-0 shadow-sm h-100">

            <div class="card-body text-center">

                <i class="bi bi-building display-5 text-success"></i>

                <h2 class="fw-bold mt-3">

                    {{ hotel_distribution.idxmax() }}

                </h2>

                <p class="text-muted mb-0">

                    Most Booked Hotel

                </p>

            </div>

        </div>

    </div>

    <div class="col-lg-4">

        <div class="card border-0 shadow-sm h-100">

            <div class="card-body text-center">

                <i class="bi bi-clock-history display-5 text-warning"></i>

                <h2 class="fw-bold mt-3">

                    {{ lead_time_distribution.idxmax() }}

                </h2>

                <p class="text-muted mb-0">

                    Most Common Lead Time

                </p>

            </div>

        </div>

    </div>

</div>
