<div class="row g-4 mb-4">

    <div class="col-lg-3">

        <div class="card border-0 shadow-sm text-center">

            <div class="card-body">

                <i class="bi bi-database display-5 text-primary"></i>

                <h3 class="fw-bold mt-2">

                    {{ "{:,}".format(total_records) }}

                </h3>

                <p class="text-muted mb-0">

                    Records

                </p>

            </div>

        </div>

    </div>

    <div class="col-lg-3">

        <div class="card border-0 shadow-sm text-center">

            <div class="card-body">

                <i class="bi bi-columns-gap display-5 text-success"></i>

                <h3 class="fw-bold mt-2">

                    {{ total_features }}

                </h3>

                <p class="text-muted mb-0">

                    Features

                </p>

            </div>

        </div>

    </div>

    <div class="col-lg-3">

        <div class="card border-0 shadow-sm text-center">

            <div class="card-body">

                <i class="bi bi-exclamation-circle display-5 text-warning"></i>

                <h3 class="fw-bold mt-2">

                    {{ missing_values }}

                </h3>

                <p class="text-muted mb-0">

                    Missing Values

                </p>

            </div>

        </div>

    </div>

    <div class="col-lg-3">

        <div class="card border-0 shadow-sm text-center">

            <div class="card-body">

                <i class="bi bi-files display-5 text-danger"></i>

                <h3 class="fw-bold mt-2">

                    {{ duplicate_records }}

                </h3>

                <p class="text-muted mb-0">

                    Duplicate Rows

                </p>

            </div>

        </div>

    </div>

</div>
