{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <!-- Profile Icon -->

                    <div class="text-center mb-4">

                        <i class="bi bi-person-circle text-primary" style="font-size:100px;"></i>

                        <h2 class="mt-3">My Profile</h2>

                    </div>

                    <form method="POST">

                        <label class="form-label">
                            <i class="bi bi-person-fill"></i>
                            Name
                        </label>

                        <input type="text" name="name" value="{{ user.name }}" class="form-control mb-3">

                        <label class="form-label">
                            <i class="bi bi-envelope-fill"></i>
                            Email
                        </label>

                        <input type="email" name="email" value="{{ user.email }}" class="form-control mb-3">

                        <label class="form-label">
                            <i class="bi bi-telephone-fill"></i>
                            Phone
                        </label>

                        <input type="text" name="phone" value="{{ user.phone }}" class="form-control mb-4">

                        <button class="btn btn-primary w-100">

                            <i class="bi bi-pencil-square"></i>

                            Update Profile

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
