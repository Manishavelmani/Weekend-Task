<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electricity Demand Forecasting Dashboard</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body>

<div class="dashboard-wrapper">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="logo-icon">
                <i class="bi bi-lightning-charge-fill"></i>
            </div>

            <h4>Energy Forecast</h4>

            <p>Deep Learning Dashboard</p>

        </div>

        <div class="sidebar-divider"></div>

        <nav class="sidebar-nav">

            <a href="{{ url_for('dashboard') }}" class="sidebar-link">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>

            <a href="{{ url_for('forecast') }}" class="sidebar-link">
                <i class="bi bi-graph-up-arrow"></i>
                <span>Forecast</span>
            </a>

            <a href="{{ url_for('analytics') }}" class="sidebar-link">
                <i class="bi bi-bar-chart-line"></i>
                <span>Analytics</span>
            </a>

            <a href="{{ url_for('validation') }}" class="sidebar-link">
                <i class="bi bi-check-circle"></i>
                <span>Validation</span>
            </a>

        </nav>

        <div class="sidebar-footer">
            <i class="bi bi-cpu"></i>
            <span>Bi-LSTM Forecasting</span>
        </div>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->
    <main class="main-content">

        <div class="container-fluid">

            {% block content %}
            {% endblock %}

        </div>

    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
