<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}Customer Intelligence{% endblock %}
    </title>
    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>
<div class="app-wrapper">
    <!-- =====================================================
         SIDEBAR
    ====================================================== -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <i class="bi bi-stars"></i>
            </div>
            <div>
                <h5>Customer AI</h5>
                <span>Intelligence Platform</span>
            </div>
        </div>
        <div class="sidebar-menu">
            <p class="menu-title">MAIN</p>
            <a
                href="{{ url_for('dashboard') }}"
                class="nav-item-custom {% if request.endpoint == 'dashboard' %}active{% endif %}"
            >
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Dashboard</span>
            </a>
            <a
                href="{{ url_for('customer') }}"
                class="nav-item-custom {% if request.endpoint == 'customer' %}active{% endif %}"
            >
                <i class="bi bi-person-search"></i>
                <span>Customer Profile</span>
            </a>
            <a
                href="{{ url_for('prediction') }}"
                class="nav-item-custom {% if request.endpoint == 'prediction' %}active{% endif %}"
            >
                <i class="bi bi-activity"></i>
                <span>Churn Prediction</span>
            </a>
            <a
                href="{{ url_for('explanation') }}"
                class="nav-item-custom {% if request.endpoint == 'explanation' %}active{% endif %}"
            >
                <i class="bi bi-bar-chart-line"></i>
                <span>SHAP Explanation</span>
            </a>
            <p class="menu-title mt-4">AI SUPPORT</p>
            <a
                href="{{ url_for('assistant') }}"
                class="nav-item-custom {% if request.endpoint == 'assistant' %}active{% endif %}"
            >
                <i class="bi bi-robot"></i>
                <span>AI Assistant</span>
            </a>
        </div>
    </aside>
    <!-- =====================================================
         MAIN AREA
    ====================================================== -->
    <main class="main-content">
        <!-- Page Content -->
        <section class="content-area">
            {% block content %}
            {% endblock %}
        </section>
    </main>
</div>
</body>
</html>
